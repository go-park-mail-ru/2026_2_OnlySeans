            updated_at: '2026-10-19T14:02:11Z'
        total: 1
        limit: 20
        offset: 0
  responses:
    BadBody:
      description: |-
        Неверный формат запроса или значения полей: не JSON, неверный email, имя или пароль.
        Текст ошибки содержит причину, например "invalid email: invalid format".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid request body
    Unauthorized:
      description: Сессия не найдена, не передана или истекла.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    InvalidCredentials:
      description: Неверная почта или пароль.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid email or password
    AccountConflict:
      description: Email или имя пользователя уже заняты.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            emailTaken:
              value:
                error: user with this email already exists
            usernameTaken:
              value:
                error: user with this username already exists
    InternalError:
      description: Ошибка сервера. Подробности клиенту не отдаются, они пишутся в журнал сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error
    RouteMethodNotAllowed:
      description: 'Метод не поддерживается: gorilla/mux возвращает 405 с пустым телом, не JSON.'
    InvalidPagination:
      description: Неверный limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidLimit:
              summary: limit не число, меньше 1 или больше 100
              value:
                error: 'invalid limit: must be an integer from 1 to 100'
            invalidOffset:
              summary: offset не число или отрицательный
              value:
                error: offset must be a non-negative integer
    InvalidFilmId:
      description: Id фильма не число или не больше нуля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: film id must be a positive integer
    InvalidRatingRequest:
      description: Неверный id фильма, тело запроса или оценка вне диапазона 1–10.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              summary: id не число или не больше нуля
              value:
                error: film id must be a positive integer
            invalidBody:
              summary: Тело невалидно или содержит неизвестные поля
              value:
                error: invalid request body
            invalidScore:
              summary: Оценка не входит в диапазон 1–10
              value:
                error: "invalid film rating: must be from 1 to 10"
    InvalidCollectionRatingsRequest:
      description: Некорректный id подборки, limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              value:
                error: collection id must be a positive integer
            invalidLimit:
              value:
                error: "invalid limit: must be an integer from 1 to 100"
            invalidOffset:
              value:
                error: offset must be a non-negative integer
    InvalidCollectionRequest:
      description: Неверный id подборки, limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              summary: id не число или не больше нуля
              value:
                error: collection id must be a positive integer
            invalidLimit:
              summary: limit не число, меньше 1 или больше 100
              value:
                error: 'invalid limit: must be an integer from 1 to 100'
            invalidOffset:
              summary: offset не число или отрицательный
              value:
                error: offset must be a non-negative integer
    FilmNotFound:
      description: Фильм не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: film not found
    CollectionNotFound:
      description: Подборка не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: collection not found
    InvalidReviewsRequest:
      description: Неверный id фильма, limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              summary: id не число или не больше нуля
              value:
                error: id must be a positive integer
            invalidLimit:
              summary: limit не число, меньше 1 или больше 100
              value:
                error: 'limit must be an integer from 1 to 100'
            invalidOffset:
              summary: offset не число или отрицательный
              value:
                error: offset must be a non-negative integer
    InvalidReview:
      description: Неверный id в пути, тело не JSON или поля отзыва не прошли проверку.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              summary: id не число или не больше нуля
              value:
                error: id must be a positive integer
            invalidBody:
              summary: не JSON, неизвестное поле, неверный тип поля или тело больше 1 МБ
              value:
                error: invalid request body
            shortTitle:
              summary: заголовок короче 3 символов
              value:
                error: 'title must be from 3 to 255 characters'
            longTitle:
              summary: заголовок длиннее 255 символов
              value:
                error: 'title must be from 3 to 255 characters'
            shortContent:
              summary: текст короче 50 символов
              value:
                error: 'content must be from 50 to 20000 characters'
            longContent:
              summary: текст длиннее 20000 символов
              value:
                error: 'content must be from 50 to 20000 characters'
    InvalidReviewId:
      description: Id отзыва не число или не больше нуля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: id must be a positive integer
    ReviewForbidden:
      description: Отзыв написал другой пользователь.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: access forbidden
    ReviewNotFound:
      description: Отзыв не найден или уже удалён.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: review not found
    ReviewConflict:
      description: Пользователь уже оставил отзыв на этот фильм.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: review already exists
    InvalidPersonsRequest:
      description: Некорректная пагинация списка персон. limit от 1 до 100, offset неотрицательный.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'invalid limit'
    InvalidPersonID:
      description: ID персоны не является положительным целым числом.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'invalid person ID'
    InvalidPersonInput:
      description: Некорректный JSON, ID, имя, фамилия или дата рождения. Превышение лимита JSON-тела также возвращает 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'first_name is invalid: too short, minimum 1 characters'
    CatalogForbidden:
      description: Роль пользователя не разрешает изменение каталога. Доступ имеют admin и editor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'forbidden'
    PersonNotFound:
      description: Персона с таким ID не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'person not found'
    InvalidAvatarFilename:
      description: Некорректное имя аватара. Требуются 32 строчные hex-цифры и расширение .jpg или .png.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'invalid avatar filename'
    AvatarNotFound:
      description: Объект аватара отсутствует в S3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'file not found'
    InvalidAvatarUpload:
      description: Нет единственного файла avatar, неверен multipart или нарушены требования к изображению.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'avatar must be a valid JPEG or PNG image'
    AvatarTooLarge:
      description: Файл больше 5 МиБ либо multipart-запрос больше 6 МиБ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'avatar file is too large'
