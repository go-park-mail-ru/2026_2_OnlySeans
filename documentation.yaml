          description: Размер страницы.
        offset:
          type: integer
          description: Смещение страницы.
      required:
        - ratings
        - total
        - limit
        - offset
      example:
        ratings:
          - film_id: 1
            average_score: 8.4
            votes: 17
          - film_id: 2
            average_score: 0
            votes: 0
        total: 6
        limit: 20
        offset: 0
