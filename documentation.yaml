          score: 8
          created_at: '2026-10-19T14:02:11Z'
          updated_at: '2026-10-19T14:02:11Z'
    FilmRatingSummary:
      type: object
      properties:
        film_id:
          type: integer
          format: int64
        average_score:
          type: number
          format: double
