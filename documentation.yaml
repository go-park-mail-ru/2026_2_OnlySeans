openapi: 3.0.3
info:
  title: API OnlySeans
  version: 1.5.0
  description: |-
    API OnlySeans: регистрация, вход, выход, профиль, фильмы, подборки, отзывы, CRUD персон и аватары.
    Основные данные и связи аватаров с аккаунтами хранятся в PostgreSQL, сессии — в Redis.
    Загружаемые аватары хранятся в S3-совместимом RustFS. Сессия передаётся в cookie session_id.
    JSON-ответы имеют Content-Type application/json; charset=utf-8. Неожиданные ошибки возвращают
    безопасное сообщение internal server error; технические подробности остаются в логах.
servers:
  - url: http://localhost:8080
tags:
  - name: Регистрация
  - name: Авторизация
  - name: Фильмы
  - name: Подборки
  - name: Рейтинги
  - name: Отзывы
  - name: Персоны
  - name: Файлы
security: []
x-cors:
  allowed-origin: http://localhost:8000
  allow-credentials: true
  allow-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow-headers:
    - Content-Type
  description: |-
    Разрешённый Origin берётся из server.allowed_origin в configs/config.yaml
    (в текущем файле http://localhost:8000; значение по умолчанию в коде http://localhost:3000).
    Сравнение строгое: localhost и 127.0.0.1 — разные Origin.
    Если Origin совпал, сервер добавляет Access-Control-Allow-Origin,
    Access-Control-Allow-Credentials: true и Vary: Origin.
    OPTIONS всегда возвращает 204 до роутера, даже для неизвестного пути или другого Origin.
    Запросы с другим Origin доходят до обработчика, но без разрешающих CORS-заголовков.
    Фронтенд должен отправлять запросы с credentials: include.
x-rate-limits:
  implementation-status: not-implemented
  description: |-
    Лимитов запросов пока нет. Сервер не возвращает 429 и Retry-After.
paths:
  /api/me/avatar:
    get:
      tags:
        - Файлы
      operationId: getMyAvatarURL
      summary: Получить ссылку на свою текущую аватарку
      description: |-
        Идентификатор аккаунта берётся из сессии. Текущий ключ файла читается из PostgreSQL,
        затем создаётся подписанная ссылка. Срок ссылки задаётся в s3.avatar_url_lifetime.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Временная ссылка на текущую аватарку.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarURLResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AvatarNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Файлы
      operationId: updateMyAvatar
      summary: Обновить свою аватарку
      description: |-
        Принимает один JPEG или PNG в multipart-поле avatar. Использует ID пользователя из сессии.
        Загружает новый файл в RustFS и заменяет привязку аватарки в PostgreSQL.
        Если аватарка ещё не назначена, устанавливает её. Возвращает 200 и новое имя файла.
        Ограничения совпадают с POST /api/avatars. Старый объект и его метаданные сохраняются.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Новая аватарка назначена текущему пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAvatarResponse'
        '400':
          $ref: '#/components/responses/InvalidAvatarUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AvatarTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Файлы
      operationId: deleteMyAvatar
      summary: Удалить свою аватарку
      description: |-
        Убирает привязку аватарки у пользователя из сессии. Повторное удаление возвращает 204.
        Физический файл в S3 и его метаданные сохраняются. Фоновая очистка не реализована.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Привязка удалена или аватарка уже отсутствовала. Тело ответа пустое.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/avatars/{filename}:
    get:
      tags:
        - Файлы
      operationId: getAvatarURL
      summary: Получить ссылку на аватар
      description: |-
        Проверяет существование файла и возвращает подписанную ссылку на чтение, действующую 15 минут.
        Принимает имя, полученное при загрузке аватара. Доступно без сессии.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{32}\.(jpg|png)$'
      responses:
        '200':
          description: Временная ссылка на файл.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarURLResponse'
        '400':
          $ref: '#/components/responses/InvalidAvatarFilename'
        '404':
          $ref: '#/components/responses/AvatarNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/avatars:
    post:
      tags:
        - Файлы
      operationId: uploadAvatar
      summary: Загрузить аватар
      description: |-
        Требует действующую сессию. Принимает один файл в поле avatar.
        Разрешены JPEG и PNG размером до 5 МиБ и не более 4096 пикселей на сторону.
        Лимит всего multipart-запроса — 6 МиБ с учётом служебных данных.
        Повреждённые изображения отклоняются, исходное имя заменяется случайным именем.
        Другая учётная запись не может быть выбрана полем запроса: используется только ID из сессии.
        Возвращает сгенерированное имя сохранённого файла и назначает его аватаром текущего пользователя.
        ID пользователя берётся из сессии. Данные файла и связь с аккаунтом сохраняются в PostgreSQL.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAvatarResponse'
        '400':
          $ref: '#/components/responses/InvalidAvatarUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AvatarTooLarge'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/register:
    post:
      tags:
        - Регистрация
      operationId: registerUser
      summary: Регистрация
      description: |-
        Создаёт пользователя и сразу открывает сессию. Подтверждать почту не нужно.
        Проверяются пароль, email, имя пользователя, затем ограничения уникальности в БД.
        Тело — один JSON-объект до 1 МиБ. Неизвестные поля, null и лишние значения запрещены.
        Content-Type запроса отдельно не проверяется. Новому пользователю назначается роль reader.
        Пользователь в ответе нужен фронтенду, чтобы сразу показать имя без отдельного запроса.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Пользователь зарегистрирован, сессия открыта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '400':
          $ref: '#/components/responses/BadBody'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '409':
          $ref: '#/components/responses/AccountConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/login:
    post:
      tags:
        - Авторизация
      operationId: loginUser
      summary: Вход
      description: |-
        Проверяет формат email, непустой пароль и bcrypt-хеш. Каждый вход создаёт новую сессию,
        старые сессии пользователя остаются действующими.
        Для неизвестной почты и неверного пароля ответ одинаковый: 401.
        Тело — один JSON-объект до 1 МиБ. Неизвестные поля, null и лишние значения запрещены.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Вход выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/logout:
    post:
      tags:
        - Авторизация
      operationId: logoutUser
      summary: Выход
      description: |-
        Требует действующую сессию. Удаляет сессию из cookie session_id и очищает cookie.
        Тело запроса не читается. Остальные сессии пользователя остаются.
        Метод проверяет роутер: GET, PUT и другие методы получают 405 до проверки сессии.
        Повторный выход той же сессией вернёт 401, потому что сессия уже удалена.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Выход выполнен. Без тела.
          headers:
            Set-Cookie:
              description: |-
                Очищает cookie session_id: Path=/; Max-Age=0; HttpOnly; SameSite=Lax.
                Secure задаётся полем CookieSecure обработчика, сейчас false.
              schema:
                type: string
              example: session_id=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/authorised:
    get:
      tags:
        - Авторизация
      operationId: getAuthorised
      summary: Проверка авторизации
      description: |-
        Возвращает 200 и данные пользователя, если cookie session_id содержит действующую сессию,
        и 401, если пользователь не авторизован. Нужна фронтенду, чтобы при загрузке страницы
        понять, вошёл ли пользователь. Запрос отправляется с credentials: include.
        Если аватар назначен, user.avatar_filename содержит имя файла. Поле отсутствует без аватара.
        Актуальную временную ссылку на изображение получают через GET /api/avatars/{filename}.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователь авторизован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films:
    get:
      tags:
        - Фильмы
      operationId: listFilms
      summary: Список фильмов
      description: |-
        Возвращает страницу фильмов в порядке возрастания id. Вход не нужен.
        Пагинация через limit и offset. Если offset больше количества фильмов, вернётся пустой массив
        films (не null), total при этом остаётся общим.
        Поиска и сортировки нет.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница фильмов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmsResponse'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films/{id}:
    get:
      tags:
        - Фильмы
      operationId: getFilmById
      summary: Фильм по id
      description: |-
        Возвращает один фильм. Вход не нужен.
        Id не число или не больше нуля — 400, фильм с таким id не найден — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой id фильма.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Фильм.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmResponse'
        '400':
          $ref: '#/components/responses/InvalidFilmId'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/collections:
    get:
      tags:
        - Подборки
      operationId: listCollections
      summary: Список подборок
      description: |-
        Возвращает страницу подборок вместе с фильмами. Вход не нужен.
        Пагинация через limit и offset применяется к подборкам, а не к фильмам.
        В каждой подборке отдаётся до 100 фильмов (первые 100 в порядке внутри подборки).
        Полный список фильмов с пагинацией — в GET /api/collections/{id}.
        Подборки идут в порядке добавления. Поиска и сортировки нет.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница подборок с фильмами.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/collections/{id}:
    get:
      tags:
        - Подборки
      operationId: getCollectionById
      summary: Подборка по id
      description: |-
        Возвращает подборку и страницу её фильмов. Вход не нужен.
        Пагинация через limit и offset применяется к фильмам подборки,
        total в ответе — общее число фильмов в подборке.
        В пути передаётся числовой id, а не slug.
        Id не число или не больше нуля — 400, подборка не найдена — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой id подборки.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 2
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Подборка со страницей фильмов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/InvalidCollectionRequest'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films/{id}/rating:
    parameters:
      - name: id
        in: path
        required: true
        description: Числовой id фильма.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 1
    get:
      tags:
        - Рейтинги
      operationId: getFilmRating
      summary: Средняя оценка фильма
      description: |-
        Возвращает средний балл и число оценок. Вход не нужен.
        Для фильма без оценок average_score равен 0, votes равен 0.
        Id не число или не больше нуля — 400, фильм не найден — 404.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Сводка оценок.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmRatingSummaryResponse'
        '400':
          $ref: '#/components/responses/InvalidRatingRequest'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Рейтинги
      operationId: setFilmRating
      summary: Поставить или изменить оценку
      description: |-
        Требует действующую сессию. Оценка автора берётся из сессии, передать account_id нельзя.
        Оценка должна быть целым числом от 1 до 10. Повторный запрос изменяет оценку пользователя,
        а триггер базы записывает новое значение в историю только при изменении балла.
        Тело ограничено 1 МБ, неизвестные поля запрещены.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmRatingInput'
      responses:
        '200':
          description: Созданная или обновлённая оценка пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmRatingResponse'
        '400':
          $ref: '#/components/responses/InvalidRatingRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Рейтинги
      operationId: deleteFilmRating
      summary: Удалить свою оценку
      description: |-
        Требует действующую сессию. Удаляет оценку текущего пользователя для указанного фильма.
        При успехе возвращает 204 без тела. Если фильм или оценка пользователя не найдены — 404.
        Средний рейтинг и количество голосов будут пересчитаны при следующем запросе,
        так как вычисляются по оставшимся оценкам.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Оценка удалена. Без тела.
        '400':
          $ref: '#/components/responses/InvalidRatingRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Фильм или личная оценка не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                filmNotFound:
                  value:
                    error: film not found
                ratingNotFound:
                  value:
                    error: rating not found
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/collections/{id}/ratings:
    get:
      tags:
        - Рейтинги
      operationId: getCollectionFilmRatings
      summary: Рейтинги фильмов подборки
      description: |-
        Возвращает средний балл и число оценок для каждого фильма подборки в порядке фильмов подборки.
        Фильмы без оценок также включены: average_score равен 0, votes равен 0.
        Результат постраничный; total содержит общее число фильмов подборки.
        Фильмы и сводки рейтингов выбираются одним SQL-запросом.
        Id не число или не больше нуля — 400, параметры пагинации некорректны — 400, подборка не найдена — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой id подборки.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 2
        - name: limit
          in: query
          required: false
          description: Размер страницы (по умолчанию 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: offset
          in: query
          required: false
          description: Смещение от начала списка (по умолчанию 0).
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Список сводок рейтингов фильмов подборки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRatingsResponse'
        '400':
          $ref: '#/components/responses/InvalidCollectionRatingsRequest'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films/{id}/reviews:
    parameters:
      - name: id
        in: path
        required: true
        description: Числовой id фильма.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 1
    get:
      tags:
        - Отзывы
      operationId: listFilmReviews
      summary: Отзывы на фильм
      description: |-
        Возвращает страницу отзывов на фильм. Вход не нужен.
        Отзывы идут от новых к старым. Пагинация через limit и offset, total — общее число отзывов фильма.
        Если отзывов нет или offset больше их количества, вернётся пустой массив reviews (не null).
        Id не число или не больше нуля — 400, фильм не найден — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница отзывов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsResponse'
        '400':
          $ref: '#/components/responses/InvalidReviewsRequest'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Отзывы
      operationId: createFilmReview
      summary: Написать отзыв
      description: |-
        Требует действующую сессию. Автор отзыва берётся из сессии, передать его в теле нельзя.
        Один пользователь может оставить на фильм только один отзыв, повторная попытка — 409.
        Пробелы в начале и конце title и content обрезаются до проверки длины.
        Длина считается в символах, а не в байтах: кириллица проверяется так же, как латиница.
        Тело не больше 1 МБ, неизвестные поля в JSON запрещены.
        Отзыв публикуется сразу, модерации пока нет.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Отзыв создан. Возвращается только идентификатор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          $ref: '#/components/responses/InvalidReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '409':
          $ref: '#/components/responses/ReviewConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Числовой id отзыва.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 1
    put:
      tags:
        - Отзывы
      operationId: updateReview
      summary: Изменить отзыв
      description: |-
        Требует действующую сессию. Менять можно только свой отзыв, чужой — 403.
        Заменяет все три поля: title, content и contains_spoilers. Если contains_spoilers не передан,
        он станет false. Автор, фильм и created_at не меняются, updated_at обновляется.
        Правила проверки полей те же, что при создании.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          description: Отзыв после изменения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/InvalidReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReviewForbidden'
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Отзывы
      operationId: deleteReview
      summary: Удалить отзыв
      description: |-
        Требует действующую сессию. Удалять можно только свой отзыв, чужой — 403.
        После удаления автор может снова написать отзыв на этот фильм.
        Тело запроса не читается.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Отзыв удалён. Без тела.
        '400':
          $ref: '#/components/responses/InvalidReviewId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReviewForbidden'
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/persons:
    get:
      tags:
        - Персоны
      operationId: listPersons
      summary: Получить список персон
      description: Возвращает страницу персон по возрастанию ID. Доступно без сессии.
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница персон. Пустой список возвращается как [], не null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonsResponse'
        '400':
          $ref: '#/components/responses/InvalidPersonsRequest'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Персоны
      operationId: createPerson
      summary: Создать персону
      description: |-
        Доступно пользователям с действующей сессией и ролью admin или editor.
        Принимает один JSON-объект размером до 1 МиБ, неизвестные поля запрещены.
        Возвращает только ID созданной персоны. Карточка доступна через GET /api/persons/{id}.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Персона создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonResponse'
        '400':
          $ref: '#/components/responses/InvalidPersonInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/persons/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonID'
    get:
      tags:
        - Персоны
      operationId: getPerson
      summary: Получить карточку персоны
      security: []
      responses:
        '200':
          description: Карточка персоны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/InvalidPersonID'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Персоны
      operationId: updatePerson
      summary: Изменить персону
      description: |-
        Доступно пользователям с действующей сессией и ролью admin или editor.
        Полностью задаёт редактируемые поля: first_name и last_name обязательны.
        Отсутствующая, пустая или null-дата birth_date очищает дату рождения.
        Неизвестные JSON-поля и дополнительные значения после первого объекта запрещены.
        Возвращает обновлённую карточку персоны.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Обновлённая карточка персоны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/InvalidPersonInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Персоны
      operationId: deletePerson
      summary: Удалить персону
      description: |-
        Доступно пользователям с действующей сессией и ролью admin или editor.
        Выполняет физическое удаление. Повторное удаление отсутствующей персоны возвращает 404.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Персона удалена. Тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/InvalidPersonID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CatalogForbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: |-
        ID серверной сессии: 64 случайных hex-символа. Сессия действует 24 часа и не продлевается.
        Браузер отправляет cookie с credentials: include. HttpOnly закрывает доступ из JavaScript.
  headers:
    SetSessionCookie:
      description: |-
        Cookie session_id: Path=/; Expires (через 24 часа); HttpOnly; SameSite=Lax.
        Secure задаётся полем CookieSecure обработчика, сейчас false. Domain и Max-Age не задаются.
      schema:
        type: string
      example: session_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa; Path=/;
        Expires=Fri, 02 Oct 2026 09:00:00 GMT; HttpOnly; SameSite=Lax
  parameters:
    PersonID:
      name: id
      in: path
      required: true
      description: Положительный числовой ID персоны.
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Сколько записей вернуть. От 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить с начала. Не меньше 0.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    PersonInput:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Имя. Пробелы по краям обрезаются, длина считается в символах.
        last_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Фамилия. Пробелы по краям обрезаются, длина считается в символах.
        birth_date:
          type: string
          nullable: true
          description: |-
            Необязательная дата в формате YYYY-MM-DD, например 1990-01-02.
            Отсутствующее поле, null или пустая строка означают отсутствие даты.
            Текущая реализация принимает дату строго после 1800-01-01 и не в будущем.
      example:
        first_name: Анна
        last_name: Иванова
        birth_date: '1990-01-02'
    Person:
      type: object
      required:
        - id
        - first_name
        - last_name
        - birth_date
        - photo_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date-time
          nullable: true
          description: В ответе дата сериализуется как time.Time, включая время и часовой пояс.
        photo_id:
          type: string
          nullable: true
          description: Несмотря на имя поля, содержит адрес фотографии (внешний или /static/...), а не числовой ID.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 123
        first_name: Анна
        last_name: Иванова
        birth_date: '1990-01-02T00:00:00Z'
        photo_id: null
        created_at: '2026-11-05T12:00:00Z'
        updated_at: '2026-11-05T12:00:00Z'
    CreatePersonResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
      example:
        id: 123
    PersonResponse:
      type: object
      required:
        - person
      properties:
        person:
          $ref: '#/components/schemas/Person'
    PersonsResponse:
      type: object
      required:
        - persons
        - total
        - limit
        - offset
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    UploadAvatarResponse:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
          pattern: '^[0-9a-f]{32}\.(jpg|png)$'
          description: Имя сохранённого аватара, совпадает с avatar_filename в профиле.
      example:
        filename: 8c6c028589154f0a8d2bc0a0a31cd084.png
    AvatarURLResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Подписанная ссылка на чтение объекта из S3. Действует 15 минут.
    Registration:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          description: Email проверяется по ASCII-шаблону после удаления пробелов по краям. Сохраняется
            исходная строка.
        username:
          type: string
          description: От 2 до 32 символов после обрезки пробелов по краям. Допускаются Unicode-буквы, ASCII-цифры, пробельные символы, дефис и подчёркивание.
          x-trimmed-min-length: 2
          x-trimmed-max-length: 32
        password:
          type: string
          writeOnly: true
          description: |-
            От 8 до 32 символов. Только латинские буквы, цифры и разрешённые спецсимволы.
            Обязательны хотя бы одна заглавная латинская буква и одна цифра.
            Пробелы и Unicode-символы не допускаются, пароль не обрезается.
          minLength: 8
          maxLength: 32
          x-allowed-special-characters: '!@#$%^&*()-_=+[]{};:,.?/'
      required:
        - email
        - username
        - password
      example:
        email: viewer@example.com
        username: Кинозритель
        password: Password1
    Credentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          description: Проверяется как при регистрации. Пользователь ищется по исходной строке email.
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Непустой пароль. Сложность при входе не проверяется.
      required:
        - email
        - password
      example:
        email: viewer@example.com
        password: Password1
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        avatar_filename:
          type: string
          description: Имя текущего аватара. Отсутствует, если аватар не назначен. Для получения ссылки используется GET /api/avatars/{filename}.
      required:
        - id
        - email
        - username
      example:
        id: 1
        email: viewer@example.com
        username: Кинозритель
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
        - user
      example:
        user:
          id: 1
          email: viewer@example.com
          username: Кинозритель
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      example:
        error: invalid email or password
    Genre:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    Film:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        original_title:
          type: string
        film_type:
          type: string
          enum:
            - movie
            - series
        release_year:
          type: integer
          format: int32
        duration_min:
          type: integer
          format: int32
        age_limit:
          type: integer
          format: int32
          description: Возрастное ограничение. В данных встречаются 0, 6, 12, 16, 18.
        description:
          type: string
        poster_url:
          type: string
        trailer_url:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
      required:
        - id
        - title
        - film_type
        - release_year
        - age_limit
        - genres
      example:
        id: 1
        title: Побег из Шоушенка
        original_title: The Shawshank Redemption
        film_type: movie
        release_year: 1994
        duration_min: 142
        age_limit: 16
        description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
        genres:
          - id: 1
            name: драма
            slug: drama
      description: |-
        Фильм. Необязательные поля (original_title, duration_min, description, poster_url,
        trailer_url) без значения в JSON отсутствуют, null не возвращается.
    Collection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        cover_url:
          type: string
        films:
          type: array
          items:
            $ref: '#/components/schemas/Film'
      required:
        - id
        - title
        - slug
        - films
      example:
        id: 1
        title: Лучшие фильмы всех времён
        slug: best-of-all-time
        description: Фильмы, которые стоит посмотреть хотя бы раз.
        films:
          - id: 1
            title: Побег из Шоушенка
            original_title: The Shawshank Redemption
            film_type: movie
            release_year: 1994
            duration_min: 142
            age_limit: 16
            description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
            genres:
              - id: 1
                name: драма
                slug: drama
      description: |-
        Подборка с фильмами. Поля description и cover_url без значения в JSON отсутствуют.
        Массив films в примере сокращён. Slug остаётся полем подборки, но в путях не используется.
    FilmsResponse:
      type: object
      properties:
        films:
          type: array
          items:
            $ref: '#/components/schemas/Film'
        total:
          type: integer
          minimum: 0
          description: Общее число фильмов.
        limit:
          type: integer
        offset:
          type: integer
      required:
        - films
        - total
        - limit
        - offset
      example:
        films:
          - id: 1
            title: Побег из Шоушенка
            original_title: The Shawshank Redemption
            film_type: movie
            release_year: 1994
            duration_min: 142
            age_limit: 16
            description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
            genres:
              - id: 1
                name: драма
                slug: drama
        total: 12
        limit: 1
        offset: 0
    FilmResponse:
      type: object
      properties:
        film:
          $ref: '#/components/schemas/Film'
      required:
        - film
      example:
        film:
          id: 1
          title: Побег из Шоушенка
          original_title: The Shawshank Redemption
          film_type: movie
          release_year: 1994
          duration_min: 142
          age_limit: 16
          description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
          genres:
            - id: 1
              name: драма
              slug: drama
    CollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        total:
          type: integer
          minimum: 0
          description: Общее число подборок.
        limit:
          type: integer
        offset:
          type: integer
      required:
        - collections
        - total
        - limit
        - offset
      example:
        collections:
          - id: 1
            title: Лучшие фильмы всех времён
