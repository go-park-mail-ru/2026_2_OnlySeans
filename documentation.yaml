openapi: 3.0.3
info:
  title: API OnlySeans
  version: 1.3.0
  description: |-
    API OnlySeans: регистрация, вход, выход, проверка авторизации, фильмы и подборки фильмов.
    Сессия хранится в cookie session_id. Данные пока лежат в памяти сервера.
servers:
  - url: http://localhost:8080
tags:
  - name: Регистрация
  - name: Авторизация
  - name: Фильмы
  - name: Подборки
security: []
x-cors:
  allowed-origin: http://localhost:3000
  allow-credentials: true
  allow-methods:
    - GET
    - POST
    - OPTIONS
  allow-headers:
    - Content-Type
  description: |-
    Разрешённый Origin берётся из server.allowed_origin в configs/config.yaml
    (по умолчанию http://localhost:3000). Сравнение строгое: localhost и 127.0.0.1 — разные Origin.
    Если Origin совпал, сервер добавляет Access-Control-Allow-Origin,
    Access-Control-Allow-Credentials: true и Vary: Origin.
    OPTIONS всегда возвращает 204 до роутера, даже для неизвестного пути или другого Origin.
    Запросы с другим Origin доходят до обработчика, но без разрешающих CORS-заголовков.
    Фронтенд должен отправлять запросы с credentials: include.
x-rate-limits:
  implementation-status: not-implemented
  description: |-
    Лимитов запросов пока нет. Сервер не возвращает 429 и Retry-After.
paths:
  /api/register:
    post:
      tags:
        - Регистрация
      operationId: registerUser
      summary: Регистрация
      description: |-
        Создаёт пользователя и сразу открывает сессию. Подтверждать почту не нужно.
        Порядок проверок: email, username, password, затем уникальность email.
        Неизвестные JSON-поля игнорируются. Content-Type не проверяется.
        Пользователь в ответе нужен фронтенду, чтобы сразу показать имя без отдельного запроса.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Пользователь зарегистрирован, сессия открыта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '400':
          $ref: '#/components/responses/BadBody'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/login:
    post:
      tags:
        - Авторизация
      operationId: loginUser
      summary: Вход
      description: |-
        Проверяет формат email, непустой пароль и bcrypt-хеш. Каждый вход создаёт новую сессию,
        старые сессии пользователя остаются действующими.
        Для неизвестной почты и неверного пароля ответ одинаковый: 401.
        Неизвестные поля игнорируются.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Вход выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/logout:
    post:
      tags:
        - Авторизация
      operationId: logoutUser
      summary: Выход
      description: |-
        Требует действующую сессию. Удаляет сессию из cookie session_id и очищает cookie.
        Тело запроса не читается. Остальные сессии пользователя остаются.
        Метод проверяет роутер: GET, PUT и другие методы получают 405 до проверки сессии.
        Повторный выход той же сессией вернёт 401, потому что сессия уже удалена.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Выход выполнен. Без тела.
          headers:
            Set-Cookie:
              description: |-
                Очищает cookie session_id: Path=/; Max-Age=0; HttpOnly; SameSite=Lax.
                Secure задаётся полем CookieSecure обработчика, сейчас false.
              schema:
                type: string
              example: session_id=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/authorised:
    get:
      tags:
        - Авторизация
      operationId: getAuthorised
      summary: Проверка авторизации
      description: |-
        Возвращает 200 и данные пользователя, если cookie session_id содержит действующую сессию,
        и 401, если пользователь не авторизован. Нужна фронтенду, чтобы при загрузке страницы
        понять, вошёл ли пользователь. Запрос отправляется с credentials: include.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователь авторизован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films:
    get:
      tags:
        - Фильмы
      operationId: listFilms
      summary: Список фильмов
      description: |-
        Возвращает страницу фильмов в порядке возрастания id. Вход не нужен.
        Пагинация через limit и offset. Если offset больше количества фильмов, вернётся пустой массив
        films (не null), total при этом остаётся общим.
        Поиска и сортировки нет.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница фильмов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmsResponse'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/films/{id}:
    get:
      tags:
        - Фильмы
      operationId: getFilmById
      summary: Фильм по id
      description: |-
        Возвращает один фильм. Вход не нужен.
        Id не число или не больше нуля — 400, фильм с таким id не найден — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой id фильма.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Фильм.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmResponse'
        '400':
          $ref: '#/components/responses/InvalidFilmId'
        '404':
          $ref: '#/components/responses/FilmNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/collections:
    get:
      tags:
        - Подборки
      operationId: listCollections
      summary: Список подборок
      description: |-
        Возвращает страницу подборок вместе с фильмами. Вход не нужен.
        Пагинация через limit и offset применяется к подборкам, а не к фильмам.
        В каждой подборке отдаётся до 100 фильмов (первые 100 в порядке внутри подборки).
        Полный список фильмов с пагинацией — в GET /api/collections/{id}.
        Подборки идут в порядке добавления. Поиска и сортировки нет.
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница подборок с фильмами.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/collections/{id}:
    get:
      tags:
        - Подборки
      operationId: getCollectionById
      summary: Подборка по id
      description: |-
        Возвращает подборку и страницу её фильмов. Вход не нужен.
        Пагинация через limit и offset применяется к фильмам подборки,
        total в ответе — общее число фильмов в подборке.
        В пути передаётся числовой id, а не slug.
        Id не число или не больше нуля — 400, подборка не найдена — 404.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой id подборки.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 2
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Подборка со страницей фильмов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/InvalidCollectionRequest'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '405':
          $ref: '#/components/responses/RouteMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: |-
        ID серверной сессии: 64 случайных hex-символа. Сессия действует 24 часа и не продлевается.
        Браузер отправляет cookie с credentials: include. HttpOnly закрывает доступ из JavaScript.
  headers:
    SetSessionCookie:
      description: |-
        Cookie session_id: Path=/; Expires (через 24 часа); HttpOnly; SameSite=Lax.
        Secure задаётся полем CookieSecure обработчика, сейчас false. Domain и Max-Age не задаются.
      schema:
        type: string
      example: session_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa; Path=/;
        Expires=Fri, 02 Oct 2026 09:00:00 GMT; HttpOnly; SameSite=Lax
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Сколько записей вернуть. От 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить с начала. Не меньше 0.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    Registration:
      type: object
      properties:
        email:
          type: string
          description: Email проверяется по ASCII-шаблону после удаления пробелов по краям. Сохраняется
            исходная строка.
        username:
          type: string
          description: От 2 до 32 Unicode-символов после удаления пробелов по краям. Сохраняется исходная
            строка.
          x-trimmed-min-length: 2
          x-trimmed-max-length: 32
        password:
          type: string
          writeOnly: true
          description: |-
            Минимум 8 байт UTF-8, одна заглавная буква и одна цифра по Unicode-классам.
            Пароль не меняется. Если он прошёл валидацию, но длиннее 72 байт, bcrypt вернёт
            ошибку и сервер ответит 500.
          x-min-utf8-bytes: 8
          x-bcrypt-max-utf8-bytes: 72
      required:
        - email
        - username
        - password
      example:
        email: viewer@example.com
        username: Кинозритель
        password: Password1
    Credentials:
      type: object
      properties:
        email:
          type: string
          description: Проверяется как при регистрации. Пользователь ищется по исходной строке email.
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Непустой пароль. Сложность при входе не проверяется.
      required:
        - email
        - password
      example:
        email: viewer@example.com
        password: Password1
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
      example:
        id: 1
        email: viewer@example.com
        username: Кинозритель
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
        - user
      example:
        user:
          id: 1
          email: viewer@example.com
          username: Кинозритель
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      example:
        error: invalid email or password
    Genre:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    Film:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        original_title:
          type: string
        film_type:
          type: string
          enum:
            - movie
            - series
        release_year:
          type: integer
          format: int32
        duration_min:
          type: integer
          format: int32
        age_limit:
          type: integer
          format: int32
          description: Возрастное ограничение. В данных встречаются 0, 6, 12, 16, 18.
        description:
          type: string
        poster_url:
          type: string
        trailer_url:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
      required:
        - id
        - title
        - film_type
        - release_year
        - age_limit
        - genres
      example:
        id: 1
        title: Побег из Шоушенка
        original_title: The Shawshank Redemption
        film_type: movie
        release_year: 1994
        duration_min: 142
        age_limit: 16
        description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
        genres:
          - id: 1
            name: драма
            slug: drama
      description: |-
        Фильм. Необязательные поля (original_title, duration_min, description, poster_url,
        trailer_url) без значения в JSON отсутствуют, null не возвращается.
    Collection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        cover_url:
          type: string
        films:
          type: array
          items:
            $ref: '#/components/schemas/Film'
      required:
        - id
        - title
        - slug
        - films
      example:
        id: 1
        title: Лучшие фильмы всех времён
        slug: best-of-all-time
        description: Фильмы, которые стоит посмотреть хотя бы раз.
        films:
          - id: 1
            title: Побег из Шоушенка
            original_title: The Shawshank Redemption
            film_type: movie
            release_year: 1994
            duration_min: 142
            age_limit: 16
            description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
            genres:
              - id: 1
                name: драма
                slug: drama
      description: |-
        Подборка с фильмами. Поля description и cover_url без значения в JSON отсутствуют.
        Массив films в примере сокращён. Slug остаётся полем подборки, но в путях не используется.
    FilmsResponse:
      type: object
      properties:
        films:
          type: array
          items:
            $ref: '#/components/schemas/Film'
        total:
          type: integer
          minimum: 0
          description: Общее число фильмов.
        limit:
          type: integer
        offset:
          type: integer
      required:
        - films
        - total
        - limit
        - offset
      example:
        films:
          - id: 1
            title: Побег из Шоушенка
            original_title: The Shawshank Redemption
            film_type: movie
            release_year: 1994
            duration_min: 142
            age_limit: 16
            description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
            genres:
              - id: 1
                name: драма
                slug: drama
        total: 12
        limit: 1
        offset: 0
    FilmResponse:
      type: object
      properties:
        film:
          $ref: '#/components/schemas/Film'
      required:
        - film
      example:
        film:
          id: 1
          title: Побег из Шоушенка
          original_title: The Shawshank Redemption
          film_type: movie
          release_year: 1994
          duration_min: 142
          age_limit: 16
          description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
          genres:
            - id: 1
              name: драма
              slug: drama
    CollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        total:
          type: integer
          minimum: 0
          description: Общее число подборок.
        limit:
          type: integer
        offset:
          type: integer
      required:
        - collections
        - total
        - limit
        - offset
      example:
        collections:
          - id: 1
            title: Лучшие фильмы всех времён
            slug: best-of-all-time
            description: Фильмы, которые стоит посмотреть хотя бы раз.
            films:
              - id: 1
                title: Побег из Шоушенка
                original_title: The Shawshank Redemption
                film_type: movie
                release_year: 1994
                duration_min: 142
                age_limit: 16
                description: Банкир Энди Дюфрейн получает пожизненный срок за убийство, которого не совершал.
                genres:
                  - id: 1
                    name: драма
                    slug: drama
        total: 4
        limit: 1
        offset: 0
    CollectionResponse:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
        total:
          type: integer
          minimum: 0
          description: Общее число фильмов в подборке.
        limit:
          type: integer
        offset:
          type: integer
      required:
        - collection
        - total
        - limit
        - offset
      example:
        collection:
          id: 2
          title: Смотрим всей семьёй
          slug: family
          description: Добрые фильмы для вечера с близкими.
          films:
            - id: 7
              title: Король Лев
              original_title: The Lion King
              film_type: movie
              release_year: 1994
              duration_min: 88
              age_limit: 0
              description: Львёнок Симба должен вернуть себе трон, который отнял его коварный дядя.
              genres:
                - id: 6
                  name: мультфильм
                  slug: animation
        total: 4
        limit: 1
        offset: 0
  responses:
    BadBody:
      description: |-
        Неверный формат запроса или значения полей: не JSON, неверный email, имя или пароль.
        Текст ошибки содержит причину, например "invalid email: invalid format".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid request body
    Unauthorized:
      description: Сессия не найдена, не передана или истекла.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    InvalidCredentials:
      description: Неверная почта или пароль.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid email or password
    EmailConflict:
      description: Эта строка email уже зарегистрирована.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: user with this email already exists
    InternalError:
      description: Ошибка сервера. Подробности клиенту не отдаются, они пишутся в журнал сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error
    RouteMethodNotAllowed:
      description: 'Метод не поддерживается: gorilla/mux возвращает 405 с пустым телом, не JSON.'
    InvalidPagination:
      description: Неверный limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidLimit:
              summary: limit не число, меньше 1 или больше 100
              value:
                error: 'invalid limit: must be an integer from 1 to 100'
            invalidOffset:
              summary: offset не число или отрицательный
              value:
                error: offset must be a non-negative integer
    InvalidFilmId:
      description: Id фильма не число или не больше нуля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: film id must be a positive integer
    InvalidCollectionRequest:
      description: Неверный id подборки, limit или offset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              summary: id не число или не больше нуля
              value:
                error: collection id must be a positive integer
            invalidLimit:
              summary: limit не число, меньше 1 или больше 100
              value:
                error: 'invalid limit: must be an integer from 1 to 100'
            invalidOffset:
              summary: offset не число или отрицательный
