x-project:
  implementation-status: not-implemented
  description: |-
    Запланированные методы. В сервере их пока нет.
    Фильмы уже возвращаются в подборке; отдельная выдача с пагинацией ещё не реализована.
    Access на 15 минут, refresh на 30 дней и Bearer — прежний план. Сейчас используются
    cookie-сессии, поэтому способ обновления сессии ещё нужно согласовать.
  paths:
    /auth/refresh:
      post:
        tags:
          - Авторизация
        operationId: refreshSession
        summary: Обновление сессии
        description: |-
          Планируется, пока не реализовано.
          В теле — refreshToken. Access-токен не нужен.
          Неизвестный, истёкший или отозванный токен — 401 INVALID_REFRESH_TOKEN.
          В ответе — новая пара access/refresh той же сессии. Старый refresh-токен погашается
          атомарно.
          Повторное использование заменённого токена отзывает сессию и возвращает 401.
          После этого нужен обычный вход.
          Access действует 15 минут, новый refresh — 30 дней. Обновлять последовательно,
          без параллельных запросов с одним refresh-токеном.
        security: []
        responses:
          '200':
            description: Новая пара токенов.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProjectSession'
          '400':
            $ref: '#/components/responses/ProjectError400'
          '401':
            description: Недействительный refresh-токен.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProjectError'
                example:
                  code: INVALID_REFRESH_TOKEN
                  message: Токен обновления недействителен.
                  requestId: request-example
          '429':
            $ref: '#/components/responses/ProjectError429'
          '503':
            $ref: '#/components/responses/ProjectError503'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRefreshRequest'
        x-implementation-status: not-implemented
    /auth/password-reset/request:
      post:
        tags:
          - Авторизация
        operationId: requestPasswordReset
        summary: Письмо для сброса пароля
        description: |-
          Планируется, пока не реализовано.
          В теле — email: 3–254 символа, формат и нормализация как при регистрации в проекте.
          Ответ всегда 202 с одинаковым message; время ответа не зависит от наличия аккаунта.
          Письмо отправляется асинхронно только для существующего аккаунта.
          Ссылка ведёт на заранее заданный доверенный адрес фронтенда.
          Токен случайный, криптографически стойкий, одноразовый, действует 15 минут.
          На сервере хранится его хеш. Новый запрос отзывает предыдущие токены восстановления.
          Токен и ссылка не возвращаются в API и не записываются в журнал.
          Лимиты: 5 запросов за час на IP и 3 за час на нормализованную почту,
          включая несуществующую. Превышение — 429 с Retry-After.
          Неверный email — 400 VALIDATION_ERROR.
        security: []
        responses:
          '202':
            description: Запрос принят.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProjectPasswordResetAccepted'
          '400':
            $ref: '#/components/responses/ProjectError400'
          '429':
            $ref: '#/components/responses/ProjectError429'
          '503':
            $ref: '#/components/responses/ProjectError503'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPasswordResetRequest'
        x-implementation-status: not-implemented
    /auth/password-reset/confirm:
      post:
        tags:
          - Авторизация
        operationId: confirmPasswordReset
        summary: Сброс пароля
        description: |-
          Планируется, пока не реализовано.
          В теле — token и newPassword. Новый пароль: 12–128 символов, без нормализации.
          Неверные поля — 400 VALIDATION_ERROR. Неизвестный, истёкший или использованный токен —
          одинаковый 400 RESET_TOKEN_INVALID.
          Проверка, погашение токена и смена хеша пароля выполняются атомарно.
          Параллельный повтор не может сменить пароль ещё раз.
          Все токены восстановления и access/refresh-сессии пользователя отзываются.
          Успех — 204. После смены пароля нужно войти с новым паролем; автоматического входа нет.
          Лимит: 10 попыток за 15 минут на IP. Превышение — 429 с Retry-After.
        security: []
        responses:
          '204':
            description: Пароль изменён. Без тела.
          '400':
            description: Неверные поля или недействительный токен сброса пароля.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProjectError'
                examples:
                  validationError:
                    summary: Ошибка в полях
                    value:
                      code: VALIDATION_ERROR
                      message: Проверьте поля запроса.
                      requestId: request-example
                      details:
                        - field: email
                          message: Некорректный адрес электронной почты.
                  invalidResetToken:
                    summary: Токен не найден, истёк или уже использован
                    value:
                      code: RESET_TOKEN_INVALID
                      message: Ссылка восстановления недействительна.
                      requestId: request-example
          '429':
            $ref: '#/components/responses/ProjectError429'
          '503':
            $ref: '#/components/responses/ProjectError503'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPasswordResetConfirm'
        x-implementation-status: not-implemented
