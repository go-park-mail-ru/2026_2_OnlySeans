version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - wsl_v5
  disable:
    - gocyclo
    - gocognit
    - funlen
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      disable:
        - decl
  exclusions:
    paths:
      - vendor/
      - third_party/
      - ".*_gen\\.go$"
      - ".*\\.pb\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/go-park-mail-ru/2026_2_OnlySeans
