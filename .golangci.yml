version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - wsl
  disable:
    - gocyclo
    - gocognit
    - funlen
  settings:
    wsl:
      allow-assign-and-call: true
      allow-cuddle-declarations: true
  exclusions:
    paths:
      - vendor/
      - third_party/
      - ".*_gen\\.go$"
      - ".*\\.pb\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/go-park-mail-ru/2026_2_OnlySeans