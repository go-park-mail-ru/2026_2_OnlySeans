syntax = "proto3";

package reviews;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_OnlySeans/pkg/reviews;reviewspb";

message ListReviewsRequest {
  int64 film_id = 1;
  int32 limit = 2;
  int64 offset = 3;
}

message Review {
  int64 id = 1;
  int64 author_id = 2;
  int64 film_id = 3;
  string title = 4;
  string content = 5;
  bool contains_spoilers = 6;
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
  int64 total = 2;
}

message ReviewInput {
  string title = 1;
  string content = 2;
  bool contains_spoilers = 3;
}

message CreateReviewRequest {
  int64 film_id = 1;
  int64 user_id = 2;
  ReviewInput review = 3;
}

message CreateReviewResponse {
  int64 id = 1;
}

message UpdateReviewRequest {
  int64 review_id = 1;
  int64 user_id = 2;
  ReviewInput review = 3;
  int64 version = 4;
}

message UpdateReviewResponse {
  Review review = 1;
}

message DeleteReviewRequest {
  int64 review_id = 1;
  int64 user_id = 2;
}

// идентификатор user_id приходит из проверенной сессии HTTP-бэкенда
service ReviewsService {
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);
  rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);
  rpc DeleteReview(DeleteReviewRequest) returns (google.protobuf.Empty);
}
