services:
  db:
    image: postgres:18.1
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./db:/schema/db:ro
      - ./services/user/db/migrations:/schema/services/user/db/migrations:ro
      - ./services/persons/db/migrations:/schema/services/persons/db/migrations:ro
      - ./services/catalog/db/migrations:/schema/services/catalog/db/migrations:ro
    configs:
      - source: database_schema
        target: /docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_db
    ports:
      - "8020:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    ports:
      - "8050:9000"
      - "8051:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket avatars; then
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket avatars
        fi

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      PGSSLMODE: disable
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    configs:
      - source: user_config
        target: /app/config.yaml
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      user:
        condition: service_started
    configs:
      - source: auth_config
        target: /app/config.yaml
    restart: unless-stopped

  persons:
    build:
      context: .
      dockerfile: services/persons/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      PGSSLMODE: disable
    configs:
      - source: persons_config
        target: /app/config.yaml
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      PGSSLMODE: disable
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    configs:
      - source: catalog_config
        target: /app/config.yaml
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      persons:
        condition: service_started
      catalog:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    configs:
      - source: gateway_config
        target: /app/config.yaml
    restart: unless-stopped

configs:
  database_schema:
    content: |
      \ir /schema/db/apply_all.sql
  user_config:
    content: |
      logger:
        level: info
      grpc:
        host: "0.0.0.0"
        port: "50051"
      s3:
        endpoint: "http://rustfs:9000"
        public_endpoint: "${S3_PUBLIC_ENDPOINT:-http://localhost:8050}"
        region: us-east-1
        bucket: avatars
        avatar_url_lifetime: 15m
        bucket_check_timeout: 5s
  auth_config:
    content: |
      logger:
        level: info
      redis:
        url: "redis://redis:6379/1"
      grpc:
        host: "0.0.0.0"
        port: "50052"
      user_service_addr: "user:50051"
      session_ttl: 72h
  persons_config:
    content: |
      logger:
        level: info
      postgres:
        url: ""
      grpc:
        host: "0.0.0.0"
        port: "50053"
  catalog_config:
    content: |
      logger:
        level: info
      postgres:
        url: ""
      grpc:
        host: "0.0.0.0"
        port: "50054"
      s3:
        endpoint: "http://rustfs:9000"
        public_endpoint: "${S3_PUBLIC_ENDPOINT:-http://localhost:8050}"
        region: us-east-1
        bucket: avatars
        poster_url_lifetime: 15m
        max_poster_size: 5242880
        max_poster_dimension: 4096
        bucket_check_timeout: 5s
        poster_cleanup_timeout: 5s
      shutdown_timeout: 10s
  gateway_config:
    content: |
      s3:
        endpoint: "http://rustfs:9000"
        region: us-east-1
        bucket: avatars
      logger:
        level: info
      http:
        addr: "0.0.0.0:8080"
        allowed_origins:
          - "http://localhost:8000"
        cookie_secure: false
        max_poster_size: 5242880
      auth_service_addr: "auth:50052"
      user_service_addr: "user:50051"
      persons_service_addr: "persons:50053"
      catalog_service_addr: "catalog:50054"

volumes:
  db_data:
  redis_data:
  rustfs-data:
