services:
  db:
    image: postgres:18.1
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/apply_all.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_db
    ports:
      - "8020:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    ports:
      - "8050:9000"
      - "8051:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: onlyseans_backend
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: "http://rustfs:9000"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-http://localhost:8050}"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ONLINECONF_URL: "http://onlineconf:8081"
      ONLINECONF_SERVICE_TOKEN: ${ONLINECONF_SERVICE_TOKEN}
      ONLINECONF_REFRESH_INTERVAL: "${ONLINECONF_REFRESH_INTERVAL:-10s}"
      ONLINECONF_HTTP_TIMEOUT: "${ONLINECONF_HTTP_TIMEOUT:-2s}"
      ONLINECONF_SNAPSHOT_PATH: "/internal/onlineconf/snapshot"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    restart: always

  onlineconf:
    image: ${ONLINECONF_IMAGE:-onlyseans_onlineconf}
    build:
      context: .
      target: onlineconf
    container_name: onlineconf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ONLINECONF_HOST: "0.0.0.0"
      ONLINECONF_PORT: "8081"
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ONLINECONF_SERVICE_TOKEN: ${ONLINECONF_SERVICE_TOKEN}
    expose:
      - "8081"
    ports:
      - "127.0.0.1:${ONLINECONF_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    restart: always

volumes:
  db_data:
  redis_data:
  rustfs-data:
