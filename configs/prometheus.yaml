global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
  - job_name: auth
    static_configs:
      - targets: ["auth:9101"]

  - job_name: user
    static_configs:
      - targets: ["user:9101"]

  - job_name: persons
    static_configs:
      - targets: ["persons:9101"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]